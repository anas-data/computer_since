<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة الحوسبة والأمن السيبراني</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--bg:#060a12;--bg2:#0c1220;--bg3:#111a2e;--ac:#00d4aa;--ac2:#ff6b9d;--ac3:#5eead4;--tx:#e8ecf4;--mt:#7b8ba5;--bd:#1a2540;--cd:#0e1628;--ok:#22c55e;--wn:#f59e0b;--er:#ef4444}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;transition:background .4s,color .4s}
body.lt{--bg:#f0f2f5;--bg2:#e5e7eb;--bg3:#dde0e6;--cd:#fff;--bd:#e0e4ea;--tx:#1a1a2e;--mt:#6b7280}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:3px}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,170,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,170,.02) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
.orb{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.25;z-index:0;transition:opacity .4s}
body.lt .orb{opacity:.08}
.glow{box-shadow:0 0 50px rgba(0,212,170,.12)}
.gb{position:relative;border:1px solid transparent;background:var(--cd);border-radius:16px;transition:background .4s}
.gb::before{content:'';position:absolute;inset:-1px;border-radius:17px;padding:1px;background:linear-gradient(135deg,var(--ac),transparent 50%,var(--ac2));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.ch{transition:all .35s cubic-bezier(.4,0,.2,1)}.ch:hover{transform:translateY(-3px);box-shadow:0 16px 50px rgba(0,212,170,.08)}
.bp{background:linear-gradient(135deg,var(--ac),#00a88a);color:#060a12;font-weight:700;padding:12px 28px;border-radius:12px;border:none;cursor:pointer;transition:all .3s;font-family:'Cairo';font-size:15px}
.bp:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,170,.25)}
.bs{background:0;color:var(--ac);font-weight:600;padding:10px 24px;border-radius:12px;border:1px solid var(--ac);cursor:pointer;transition:all .3s;font-family:'Cairo';font-size:14px}
.bs:hover{background:rgba(0,212,170,.08)}
.fi{animation:fi .45s ease-out}@keyframes fi{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.ni{padding:8px 14px;border-radius:8px;cursor:pointer;transition:all .25s;font-size:14px;color:var(--mt)}
.ni:hover{background:rgba(0,212,170,.08);color:var(--ac)}.ni.act{background:rgba(0,212,170,.12);color:var(--ac)}
.uc{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:20px;cursor:pointer;transition:all .35s;position:relative;overflow:hidden}
.uc::after{content:'';position:absolute;top:0;right:0;width:3px;height:0;background:var(--ac);transition:height .35s;border-radius:0 0 0 3px}
.uc:hover::after{height:100%}.uc:hover{border-color:rgba(0,212,170,.25);transform:translateX(-3px)}
.qo{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:10px}
.qo:hover{border-color:var(--ac);background:rgba(0,212,170,.04)}
.qo.ok{border-color:var(--ok);background:rgba(34,197,94,.08)}.qo.no{border-color:var(--er);background:rgba(239,68,68,.08)}.qo.dis{pointer-events:none;opacity:.65}
.fc{perspective:1000px;cursor:pointer;height:160px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;padding:18px;text-align:center}
.fc-f{background:linear-gradient(135deg,var(--bg3),var(--cd));border:1px solid var(--bd)}
.fc-b{background:linear-gradient(135deg,rgba(0,212,170,.08),var(--cd));border:1px solid var(--ac);transform:rotateY(180deg)}
.tb{padding:8px 20px;border-radius:10px;border:1px solid var(--bd);background:0;color:var(--mt);cursor:pointer;transition:all .25s;font-family:'Cairo';font-weight:600;font-size:13px}
.tb.act{background:rgba(0,212,170,.12);color:var(--ac);border-color:var(--ac)}.tb:hover{border-color:var(--ac);color:var(--tx)}
.pb{height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--ac),var(--ac3));border-radius:2px;transition:width .5s}
.acc-c{max-height:0;overflow:hidden;transition:max-height .45s ease}.acc-c.open{max-height:6000px}
.sb{position:fixed;bottom:20px;left:20px;z-index:999;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--bg2);color:var(--mt);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;font-size:16px}
.sb:hover{border-color:var(--ac);color:var(--ac)}.sb.on{border-color:var(--ac);color:var(--ac);background:rgba(0,212,170,.08)}
.sb .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ac)}.sb .dot.off{display:none}
.sw{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0;pointer-events:none}.sw.go{animation:sw .55s ease-out}
@keyframes sw{0%{opacity:.5;transform:scale(1)}100%{opacity:0;transform:scale(1.7)}}
.smod{position:fixed;inset:0;z-index:1000;background:rgba(6,10,18,.85);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding-top:10vh}
.smod.show{display:flex}
.sin{background:var(--cd);border:1px solid var(--bd);border-radius:16px;width:90%;max-width:540px;overflow:hidden}
.sin input{width:100%;padding:12px 16px;background:var(--bg2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font-family:'Cairo';font-size:14px;outline:0;transition:border-color .2s}
.sin input:focus{border-color:var(--ac)}
.sr{padding:10px 16px;cursor:pointer;transition:background .2s;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
.sr:hover{background:rgba(0,212,170,.06)}.sr:last-child{border-bottom:0}
.pmod{position:fixed;inset:0;z-index:1001;background:var(--bg);display:none;flex-direction:column;transition:background .4s}
.pmod.show{display:flex}
.pbar{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.pbody{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;padding:0 5px;border-radius:4px;background:var(--bg3);border:1px solid var(--bd);font-size:9px;font-family:monospace;color:var(--mt)}
.sc{background:var(--bg3);border-radius:12px;padding:14px;border:1px solid var(--bd)}
.sc h4{font-size:13px;margin-bottom:6px}.sc p{font-size:12px;color:var(--mt)}
.sc .ic{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
@media(max-width:768px){.ug{grid-template-columns:1fr!important}.sg{grid-template-columns:repeat(2,1fr)!important}.ht{font-size:24px!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.np{display:none!important}body{background:#fff;color:#000}body::before,.orb{display:none}}
</style>
</head>
<body>
<div class="orb" style="width:400px;height:400px;background:rgba(0,212,170,.06);top:-60px;right:-60px"></div>
<div class="orb" style="width:300px;height:300px;background:rgba(255,107,157,.04);bottom:-30px;left:-60px"></div>
<button class="sb on np" id="sB" onclick="togS()" aria-label="صوت"><i class="fas fa-volume-high" id="sI"></i><div class="dot" id="sD"></div><div class="sw" id="sW"></div></button>
<header class="sticky top-0 z-50 backdrop-blur-xl border-b np" style="border-color:var(--bd);background:color-mix(in srgb,var(--bg) 85%,transparent)">
<div class="max-w-7xl mx-auto px-4 sm:px-6">
<div class="flex items-center justify-between h-14">
<div class="flex items-center gap-3 cursor-pointer" onclick="go('home')">
<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[--ac] to-[#00a88a] flex items-center justify-center"><i class="fas fa-microchip text-sm" style="color:var(--bg)"></i></div>
<div><div class="font-bold text-xs leading-tight">الحوسبة المتقدمة</div><div class="text-[9px]" style="color:var(--mt)">والأمن السيبراني</div></div>
</div>
<nav class="hidden md:flex items-center gap-1" id="nav">
<div class="ni act" data-p="home" onclick="go('home')"><i class="fas fa-home ml-1 text-xs"></i>الرئيسية</div>
<div class="ni" data-p="c1" onclick="go('c1')"><i class="fas fa-laptop-code ml-1 text-xs"></i>الحوسبة</div>
<div class="ni" data-p="c2" onclick="go('c2')"><i class="fas fa-shield-halved ml-1 text-xs"></i>الأمن</div>
</nav>
<div class="flex items-center gap-2">
<button class="np w-8 h-8 rounded-lg flex items-center justify-center hover:opacity-80" style="color:var(--mt)" onclick="openSrch()" title="بحث"><i class="fas fa-search text-sm"></i></button>
<button class="np w-8 h-8 rounded-lg flex items-center justify-center hover:opacity-80" style="color:var(--mt)" onclick="togTh()" id="thB" title="المظهر"><i class="fas fa-moon text-sm"></i></button>
<button class="md:hidden w-8 h-8 rounded-lg flex items-center justify-center" style="color:var(--mt)" onclick="document.getElementById('mm').classList.toggle('hidden')"><i class="fas fa-bars"></i></button>
</div></div></div>
<div class="md:hidden hidden border-t" style="border-color:var(--bd);background:var(--bg2)" id="mm">
<div class="p-3 flex flex-col gap-1">
<div class="ni" onclick="go('home');document.getElementById('mm').classList.add('hidden')"><i class="fas fa-home ml-1"></i>الرئيسية</div>
<div class="ni" onclick="go('c1');document.getElementById('mm').classList.add('hidden')"><i class="fas fa-laptop-code ml-1"></i>الحوسبة</div>
<div class="ni" onclick="go('c2');document.getElementById('mm').classList.add('hidden')"><i class="fas fa-shield-halved ml-1"></i>الأمن</div>
</div></div>
</header>
<main class="relative z-10 min-h-screen" id="app"></main>
<footer class="relative z-10 border-t np" style="border-color:var(--bd);background:var(--bg2)">
<div class="max-w-7xl mx-auto px-6 py-6 text-center text-xs" style="color:var(--mt)">منصة الحوسبة المتقدمة والأمن السيبراني &copy; 2025</div>
</footer>
<div class="smod" id="sM" onclick="if(event.target===this)closeSrch()">
<div class="sin fi"><div class="p-4" style="border-bottom:1px solid var(--bd)">
<div class="relative"><i class="fas fa-search absolute top-1/2 -translate-y-1/2 right-4" style="color:var(--mt)"></i><input id="sI2" placeholder="ابحث..." oninput="doSrch(this.value)" dir="rtl"></div>
<div class="flex items-center gap-2 mt-2 text-xs" style="color:var(--mt)"><span class="kbd">Esc</span> إغلاق <span class="kbd">Enter</span> فتح <span class="kbd">&uarr;&darr;</span> تنقل</div>
</div><div id="sR" style="max-height:50vh;overflow-y:auto"><div class="p-6 text-center text-sm" style="color:var(--mt)">اكتب للبحث...</div></div></div>
</div>
<div class="pmod" id="pM">
<div class="pbar"><div class="text-sm font-bold" id="pT">عرض</div><div class="flex items-center gap-2"><span class="text-xs" style="color:var(--mt)" id="pC">1/1</span>
<button class="w-8 h-8 rounded-lg flex items-center justify-center" style="color:var(--mt);background:var(--bg3)" onclick="pNav(-1)"><i class="fas fa-chevron-right text-xs"></i></button>
<button class="w-8 h-8 rounded-lg flex items-center justify-center" style="color:var(--mt);background:var(--bg3)" onclick="pNav(1)"><i class="fas fa-chevron-left text-xs"></i></button>
<button class="w-8 h-8 rounded-lg flex items-center justify-center" style="color:var(--er)" onclick="closeP()"><i class="fas fa-times"></i></button></div></div>
<div class="pbody" id="pB"></div>
</div>
<script>
// ===== صوت =====
let sndOn=true,ac=null;
function ia(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}
function tone(t,d,f,v){if(!sndOn)return;ia();try{const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function sH(){tone('sine',.08,880,.02);setTimeout(()=>tone('sine',.06,1200,.015),30)}
function sC(){tone('triangle',.1,600,.04)}
function sOk(){tone('sine',.18,523,.035);setTimeout(()=>tone('sine',.18,784,.035),110)}
function sNo(){const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();if(!sndOn)return;ia();try{o.type='sawtooth';o.frequency.setValueAtTime(200,ac.currentTime);o.frequency.exponentialRampToValueAtTime(140,ac.currentTime+.18);f.type='lowpass';g.gain.setValueAtTime(.025,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.connect(f);f.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.22)}catch(e){}}
function sFl(){tone('sine',.12,1000,.03)}
function togS(){sndOn=!sndOn;const b=document.getElementById('sB');b.classList.toggle('on',sndOn);document.getElementById('sI').className=sndOn?'fas fa-volume-high':'fas fa-volume-xmark';document.getElementById('sD').classList.toggle('off',!sndOn);const w=document.getElementById('sW');w.classList.remove('go');void w.offsetWidth;w.classList.add('go');if(sndOn)sC()}

// ===== مظهر =====
let dk=true;function togTh(){dk=!dk;document.body.classList.toggle('lt',!dk);document.getElementById('thB').innerHTML=dk?'<i class="fas fa-moon text-sm"></i>':'<i class="fas fa-sun text-sm"></i>';sC()}

// ===== تخزين =====
let done=new Set();
function ldD(){try{const d=localStorage.getItem('cy_d');if(d)done=new Set(JSON.parse(d))}catch(e){}}
function svD(){try{localStorage.setItem('cy_d',JSON.stringify([...done]))}catch(e){}}

// ===== بحث =====
let sIdx=-1,sRes=[];
function openSrch(){document.getElementById('sM').classList.add('show');document.getElementById('sI2').value='';document.getElementById('sR').innerHTML='<div class="p-6 text-center text-sm" style="color:var(--mt)">اكتب للبحث...</div>';sIdx=-1;sRes=[];setTimeout(()=>document.getElementById('sI2').focus(),100);sC()}
function closeSrch(){document.getElementById('sM').classList.remove('show')}
function doSrch(q){if(!q.trim()){document.getElementById('sR').innerHTML='<div class="p-6 text-center text-sm" style="color:var(--mt)">اكتب للبحث...</div>';sRes=[];sIdx=-1;return}
const ql=q.toLowerCase();sRes=[];
Object.values(U).forEach(u=>{if(u.t.includes(ql)||u.obj.some(o=>o.includes(ql)))sRes.push({t:u.t,s:`الوحدة ${u.n} — ${C[u.c].t}`,u:u.id,i:'book'});
u.sec.forEach(sec=>{if(sec.t.includes(ql)||sec.c.toLowerCase().includes(ql))sRes.push({t:sec.t,s:`قسم — الوحدة ${u.n}: ${u.t}`,u:u.id,i:'paragraph'})});
u.fl.forEach(f=>{if(f[0].includes(ql)||f[1].includes(ql))sRes.push({t:f[0],s:`بطاقة — الوحدة ${u.n}`,u:u.id,i:'clone'})});
u.qz.forEach(qq=>{if(qq.q.includes(ql))sRes.push({t:qq.q,s:`سؤال — الوحدة ${u.n}`,u:u.id,i:'question-circle'})})});
sIdx=-1;
if(!sRes.length){document.getElementById('sR').innerHTML='<div class="p-6 text-center text-sm" style="color:var(--mt)">لا نتائج</div>';return}
document.getElementById('sR').innerHTML=sRes.map((r,i)=>`<div class="sr" data-i="${i}" onclick="closeSrch();go('u','${r.u}')"><div class="ic" style="background:var(--bg3)"><i class="fas fa-${r.i} text-xs" style="color:var(--ac)"></i></div><div><div class="text-sm font-bold">${r.t}</div><div class="text-xs" style="color:var(--mt)">${r.s}</div></div></div>`).join('')}

// ===== عرض =====
let pSl=[],pI=0;
function openP(uid){const u=U[uid];if(!u)return;pSl=[{tp:'t',d:u}];u.sec.forEach(s=>pSl.push({tp:'s',d:s}));pSl.push({tp:'m',d:u.sum},{tp:'w',d:u.mis});pI=0;document.getElementById('pT').textContent=u.t;document.getElementById('pM').classList.add('show');rP();sC()}
function closeP(){document.getElementById('pM').classList.remove('show')}
function pNav(d){pI=Math.max(0,Math.min(pSl.length-1,pI+d));rP()}
function rP(){const s=pSl[pI];document.getElementById('pC').textContent=`${pI+1}/${pSl.length}`;let h='';
if(s.tp==='t')h=`<div class="text-center fi"><div class="text-4xl font-black mb-4" style="color:var(--ac)">${s.d.t}</div><div class="text-lg" style="color:var(--mt)">${C[s.d.c].t} — الوحدة ${s.d.n}</div><div class="flex gap-4 mt-6 justify-center text-sm" style="color:var(--mt)"><span><i class="fas fa-clock ml-1"></i>${s.d.dur}</span><span>${s.d.dif}</span><span>${s.d.qz.length} أسئلة</span></div></div>`;
else if(s.tp==='s')h=`<div class="fi"><h2 class="text-2xl font-black mb-6" style="color:var(--ac)">${s.d.t}</h2><div class="text-lg leading-relaxed">${s.d.c}</div></div>`;
else if(s.tp==='m')h=`<div class="fi"><h2 class="text-2xl font-black mb-6" style="color:var(--ac)"><i class="fas fa-list-check ml-2"></i>ملخص</h2><div class="space-y-3">${s.d.map(x=>`<div class="flex items-start gap-3 text-lg"><i class="fas fa-check-double mt-1" style="color:var(--ac)"></i><span>${x}</span></div>`).join('')}</div></div>`;
else if(s.tp==='w')h=`<div class="fi"><h2 class="text-2xl font-black mb-6" style="color:var(--er)"><i class="fas fa-triangle-exclamation ml-2"></i>مفاهيم خاطئة</h2><div class="space-y-3">${s.d.map(x=>`<div class="flex items-start gap-3 text-lg rounded-xl p-4" style="background:rgba(239,68,68,.08)"><i class="fas fa-times-circle mt-1" style="color:var(--er)"></i><span>${x}</span></div>`).join('')}</div></div>`;
document.getElementById('pB').innerHTML=`<div style="max-width:800px;width:100%">${h}</div>`}

// ===== لوحة مفاتيح =====
document.addEventListener('keydown',e=>{
if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSrch()}
if(e.key==='Escape'){closeSrch();closeP()}
if(document.getElementById('sM').classList.contains('show')){
if(e.key==='ArrowDown'){e.preventDefault();sIdx=Math.min(sIdx+1,sRes.length-1);document.querySelectorAll('.sr').forEach((r,i)=>r.style.background=i===sIdx?'rgba(0,212,170,.1)':'')}
if(e.key==='ArrowUp'){e.preventDefault();sIdx=Math.max(sIdx-1,0);document.querySelectorAll('.sr').forEach((r,i)=>r.style.background=i===sIdx?'rgba(0,212,170,.1)':'')}
if(e.key==='Enter'&&sIdx>=0){e.preventDefault();closeSrch();go('u',sRes[sIdx].u)}}
if(document.getElementById('pM').classList.contains('show')){if(e.key==='ArrowLeft'||e.key===' ')pNav(1);if(e.key==='ArrowRight')pNav(-1)}
});
document.addEventListener('mouseover',e=>{if(e.target.closest('.ni,.bp,.bs,.uc,.qo,.tb,.ch,[onclick]'))sH()});

// ===== بيانات المساقات =====
const C={c1:{id:'c1',t:'أساسيات الحاسب المتقدم',st:'من تمثيل البيانات إلى الخوارزميات',ic:'fas fa-laptop-code',d:'مساق شامل: النظام الثنائي، بنية الحاسوب، أنظمة التشغيل، الشبكات، الخوارزميات.',u:['u1','u2','u3','u4','u5']},
c2:{id:'c2',t:'الحماية الرقمية والأمن السيبراني',st:'من مبادئ الأمن إلى حماية الخصوصية',ic:'fas fa-shield-halved',d:'مساق متخصص: CIA، التشفير، أمن الشبكات، البرمجيات الخبيثة، الخصوصية.',u:['u6','u7','u8','u9','u10']}};

// ===== بيانات الوحدات =====
const U={
u1:{id:'u1',n:1,c:'c1',t:'الأنظمة الثنائية وتمثيل البيانات',ic:'fas fa-binary',dur:'90 د',dif:'متوسط',
obj:['تفسير سبب اعتماد الحاسوب على النظام الثنائي','تحويل الأعداد بين العشري والثنائي','شرح تمثيل الأعداد بمكمل الاثنين','وصف معيار IEEE 754','المقارنة بين ASCII و Unicode','شرح تمثيل الصور والصوت رقميًا'],
sec:[
{t:'مقدمة: لماذا النظام الثنائي؟',c:'<p style="margin-bottom:10px">الحاسوب يعتمد على ترانزستورات لها حالتان: <strong style="color:var(--ac)">مفتوح (1)</strong> أو <strong style="color:var(--ac)">مغلق (0)</strong>. كل شيء يُحوَّل إلى 0 و1.</p><p>مثال: الحرف "A" يُحوَّل إلى <code style="background:var(--bg3);padding:2px 8px;border-radius:4px;color:var(--ac)">01000001</code> (الرقم 65 في ASCII).</p>'},
{t:'وحدات قياس البيانات',c:'<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+[['بِت','0 أو 1'],['بايت','8 بِت = 256 قيمة'],['KB','1024 بايت'],['MB','1024 KB'],['GB','1024 MB'],['TB','1024 GB']].map(([a,b])=>'<div class="sc" style="text-align:center"><div style="font-size:18px;font-weight:900;color:var(--ac)">'+a+'</div><div style="font-size:10px">'+b+'</div></div>').join('')+'</div>'},
{t:'التحويل بين الأنظمة',c:'<div class="sc"><div style="font-weight:700;color:var(--ac);margin-bottom:6px">تحويل 13 من عشري إلى ثنائي:</div><div style="font-family:monospace;font-size:13px;line-height:1.8" dir="ltr"><div>13 ÷ 2 = 6 r <span style="color:var(--ac)">1</span></div><div>6 ÷ 2 = 3 r <span style="color:var(--ac)">0</span></div><div>3 ÷ 2 = 1 r <span style="color:var(--ac)">1</span></div><div>1 ÷ 2 = 0 r <span style="color:var(--ac)">1</span></div></div><div style="margin-top:6px">النتيجة: <code style="background:var(--bg);padding:2px 8px;border-radius:4px;color:var(--ac)">1101</code></div></div>'},
{t:'مكمل الاثنين (الأعداد السالبة)',c:'<div class="sc"><div style="font-weight:700;color:var(--ac);margin-bottom:6px">تمثيل -5 في 8 بِت:</div><div style="font-size:13px;line-height:2"><div>1. 5 ثنائي: <code style="background:var(--bg);padding:2px 8px;border-radius:4px">00000101</code></div><div>2. اقلب: <code style="background:var(--bg);padding:2px 8px;border-radius:4px">11111010</code></div><div>3. أضف 1: <code style="background:var(--bg);padding:2px 8px;border-radius:4px;color:var(--ac);font-weight:700">11111011</code></div></div><p style="margin-top:6px;font-size:12px;color:var(--mt)">8 بِت موقّعة: من -128 إلى +127</p></div>'},
{t:'IEEE 754 — الأعداد الحقيقية',c:'<div class="sc"><div style="display:flex;gap:6px;font-size:12px;font-family:monospace" dir="ltr"><div style="flex:1;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;padding:8px;text-align:center"><div style="color:#ef4444;font-size:10px">1 bit</div><div style="font-weight:700">Sign</div></div><div style="flex:2;background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.3);border-radius:6px;padding:8px;text-align:center"><div style="color:#eab308;font-size:10px">8 bits</div><div style="font-weight:700">Exponent</div></div><div style="flex:3;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);border-radius:6px;padding:8px;text-align:center"><div style="color:#22c55e;font-size:10px">23 bits</div><div style="font-weight:700">Mantissa</div></div></div></div>'},
{t:'ASCII و Unicode',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">ASCII:</strong> 7 بِت = 128 حرفًا (إنجليزية فقط).</p><p style="margin-bottom:6px"><strong style="color:var(--ac)">Unicode:</strong> 149,000+ حرف من كل اللغات. UTF-8 يستخدم 1-4 بايت.</p><div class="sc" style="font-family:monospace;font-size:13px" dir="ltr"><div>\'A\' → <span style="color:var(--ac)">0x41</span> (1 byte)</div><div>\'أ\' → <span style="color:var(--ac)">0xD8A3</span> (2 bytes)</div></div>'},
{t:'تمثيل الوسائط رقميًا',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">صور:</strong> مصفوفة بكسلات RGB. كل بكسل = 3 بايت.</p><p style="margin-bottom:6px"><strong style="color:var(--ac)">صوت:</strong> عينات رقمية. CD = 44,100 عينة/ثانية × 16 بِت.</p><p><strong style="color:var(--ac)">فيديو:</strong> إطارات + صوت + ضغط. دقيقة 1080p ≈ 100 MB بدون ضغط.</p>'}
],svg:'dr',sum:['كل البيانات تُختزل إلى 0 و1','البِت أصغر وحدة، البايت = 8 بِت','مكمل الاثنين لتمثيل السالب','IEEE 754 = إشارة + أس + كسر','Unicode يدعم العربية بـ UTF-8','الوسائط تُمثَّل رقميًا ثم تُضغط'],mis:['البايت = 8 بِت وليس 1000 بِت','الخلط بين KB الحاسوبي (1024) والتخزيني (1000)','الحرف يُخزَّن كرقم ثنائي وليس كنص'],qz:[{q:'أصغر وحدة بيانات:',o:['البايت','الكلمة','البِت','النيبل'],a:2},{q:'الحرف "أ" في UTF-8 يحتاج:',o:['1 بايت','2 بايت','3 بايت','4 بايت'],a:1},{q:'10000000 في مكمل اثنين =',o:['-128','-127','128','0'],a:0},{q:'بِتّات الأس في IEEE 754:',o:['1','8','23','32'],a:1},{q:'صورة 800×600 RGB =',o:['480K','1.44M','800K','2.4M'],a:1}],fl:[['البِت','أصغر وحدة: 0 أو 1'],['البايت','8 بِتّات = 256 قيمة'],['مكمل الاثنين','طريقة تمثيل السالب'],['IEEE 754','معيار الأعداد الحقيقية'],['ASCII','128 حرف بـ 7 بِت'],['Unicode','معيار عالمي لكل اللغات']]},

u3:{id:'u3',n:3,c:'c1',t:'أساسيات أنظمة التشغيل',ic:'fas fa-server',dur:'90 د',dif:'متوسط',
obj:['تعريف نظام التشغيل','إدارة العمليات والخيوط','خوارزميات الجدولة','الذاكرة الافتراضية','أنظمة الملفات','أنواع النواة'],
sec:[
{t:'ما هو نظام التشغيل؟',c:'<p style="margin-bottom:10px">الطبقة الوسيطة بين التطبيقات والعَتاد.</p><div style="text-align:center;margin-bottom:10px"><div style="background:rgba(0,212,170,.08);border:1px solid rgba(0,212,170,.25);border-radius:8px;padding:8px;font-weight:700;color:var(--ac);font-size:13px">المستخدم والتطبيقات</div><div style="color:var(--mt);font-size:11px">↓ System Calls</div><div style="background:rgba(255,107,157,.08);border:1px solid rgba(255,107,157,.25);border-radius:8px;padding:8px;font-weight:700;color:var(--ac2);font-size:13px">نظام التشغيل</div><div style="color:var(--mt);font-size:11px">↓ تعليمات الآلة</div><div style="background:rgba(234,179,8,.08);border:1px solid rgba(234,179,8,.25);border-radius:8px;padding:8px;font-weight:700;color:#eab308;font-size:13px">العَتاد</div></div>'},
{t:'العمليات والخيوط',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">العملية:</strong> برنامج قيد التنفيذ — لها ذاكرة مستقلة.</p><p style="margin-bottom:8px"><strong style="color:var(--ac)">الخيط:</strong> وحدة تنفيذية داخل العملية — يشارك الذاكرة.</p><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:4px;font-size:10px;text-align:center">'+[['جديدة','#3b82f6'],['جاهزة','#22c55e'],['تشغيل','#eab308'],['انتظار','#f97316'],['منتهية','#ef4444']].map(([a,c])=>'<div style="background:'+c+'18;border:1px solid '+c+'40;border-radius:6px;padding:5px;color:'+c+';font-weight:700">'+a+'</div>').join('')+'</div>'},
{t:'خوارزميات الجدولة',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc"><strong style="color:var(--ac);font-size:13px">FCFS — الأولوية للأول:</strong><p>بسيط لكن قد يسبب مجاعة للعمليات القصيرة.</p></div><div class="sc"><strong style="color:var(--ac2);font-size:13px">SJF — الأقصر أولًا:</strong><p>متوسط انتظار أقل، يحتاج معرفة الزمن مسبقًا.</p></div><div class="sc"><strong style="color:#eab308;font-size:13px">Round Robin — الدوران:</strong><p>فترة زمنية متساوية لكل عملية — عادل.</p></div></div>'},
{t:'الذاكرة الافتراضية',c:'<p>عند امتلاء RAM، يُنقل جزء غير مستخدم إلى القرص (Swap).</p><div class="sc" style="margin-top:6px"><p style="color:var(--er)"><strong>تحذير:</strong> القرص أبطأ آلاف المرات من RAM. الذاكرة الافتراضية <strong style="color:var(--ac)">مكمّلة</strong> وليست بديلة.</p></div>'},
{t:'أنظمة الملفات والنواة',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">NTFS</strong> (Windows) | <strong style="color:var(--ac)">ext4</strong> (Linux) | <strong style="color:var(--ac)">APFS</strong> (macOS) | <strong style="color:var(--ac)">FAT32</strong> (توافق)</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><div class="sc"><strong style="color:var(--ac)">Monolithic</strong><p>كل شيء في النواة — سريع. مثل: Linux.</p></div><div class="sc"><strong style="color:var(--ac2)">Microkernel</strong><p>نواة مصغّرة — أكثر استقرارًا. مثل: MINIX.</p></div></div>'}
],svg:'os',sum:['نظام التشغيل طبقة وسيطة تُدار الموارد','العملية = برنامج قيد التنفيذ، الخيط = وحدة داخلها','FCFS, SJF, Round Robin خوارزميات جدولة','الذاكرة الافتراضية مكملة وليست بديلة','Monolithic أسرع، Microkernel أكثر استقرارًا'],mis:['الخلط بين العملية والبرنامج','الذاكرة الافتراضية ليست بديلة عن RAM','الخيوط تشارك ذاكرة العملية وليست مستقلة'],qz:[{q:'الطبقة الوسيطة:',o:['المتصفح','OS','المعالج','الذاكرة'],a:1},{q:'الخيوط تشترك في:',o:['لا شيء','ذاكرة العملية','CPU فقط','القرص'],a:1},{q:'فترة زمنية متساوية:',o:['FCFS','SJF','Round Robin','Priority'],a:2},{q:'الذاكرة الافتراضية تستخدم:',o:['RAM','المعالج','القرص','الكاش'],a:2},{q:'نظام ملفات Linux:',o:['NTFS','APFS','ext4','FAT32'],a:2}],fl:[['نظام التشغيل','طبقة وسيطة تُدار الموارد'],['العملية','برنامج قيد التنفيذ بذاكرة مستقلة'],['الخيط','وحدة تنفيذية تشترك في الذاكرة'],['Round Robin','جدولة بفترات زمنية متساوية'],['الذاكرة الافتراضية','استخدام القرص لتوسيع RAM'],['Microkernel','نواة مصغّرة أكثر استقرارًا']]},

{t:'TCP مقابل UDP',c:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="sc" style="border-color:rgba(0,212,170,.25)"><div style="font-weight:700;color:var(--ac);margin-bottom:4px">TCP</div><div style="font-size:11px;color:var(--mt)"><div>✓ مضمون الوصول</div><div>✓ يرتب البيانات</div><div>✓ مصافحة ثلاثية</div><div style="color:var(--ac);margin-top:4px">تصفح، بريد، ملفات</div></div></div><div class="sc" style="border-color:rgba(255,107,157,.25)"><div style="font-weight:700;color:var(--ac2);margin-bottom:4px">UDP</div><div style="font-size:11px;color:var(--mt)"><div>✗ غير مضمون</div><div>✗ قد يفقد ترتيب</div><div>✓ أسرع بكثير</div><div style="color:var(--ac2);margin-top:4px">بث مباشر، ألعاب</div></div></div></div>'},
{t:'IP و MAC',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">IP:</strong> منطقي، يتغير. <code style="background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:12px">192.168.1.1</code></p><p style="margin-bottom:6px"><strong style="color:var(--ac)">MAC:</strong> فيزيائي، ثابت. <code style="background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:12px">AA:BB:CC:DD:EE:FF</code></p><p style="font-size:11px;color:var(--mt)">IPv4=32 بِت (~4 مليار). IPv6=128 بِت.</p>'},
{t:'أجهزة الشبكة',c:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+[['Switch','يُوجّه بـ MAC محليًا'],['Router','يُوجّه بـ IP بين شبكات'],['Firewall','يُفلتر حركة البيانات'],['DNS','يترجم النطاقات لـ IP']].map(([a,b])=>'<div class="sc"><strong style="color:var(--ac);font-size:13px">'+a+'</strong><div style="font-size:11px;color:var(--mt)">'+b+'</div></div>').join('')+'</div><div class="sc" style="margin-top:6px;font-size:11px"><strong>منافذ:</strong> <span style="color:var(--mt)">HTTP:80 | HTTPS:443 | SSH:22 | DNS:53</span></div>'}
],svg:'osi',sum:['LAN محلية، WAN واسعة','OSI = 7 طبقات','TCP مضمون وبطيء، UDP سريع وغير مضمون','IP منطقي، MAC فيزيائي ثابت','Switch بـ MAC، Router بـ IP'],mis:['MAC ثابت لكن يمكن تزويره','TCP ليس دائمًا الأفضل','DNS على منفذ 53 وليس 80'],qz:[{q:'طبقة التوجيه:',o:['النقل','الشبكة','ربط البيانات','الفيزيائية'],a:1},{q:'يُوجّه بين شبكات:',o:['Switch','Hub','Router','AP'],a:2},{q:'بروتوكول البث المباشر:',o:['TCP','HTTP','FTP','UDP'],a:3},{q:'عنوان MAC:',o:['منطقي','فيزيائي ثابت','مؤقت','للشبكة فقط'],a:1},{q:'منفذ HTTPS:',o:['80','443','22','53'],a:1}],fl:[['LAN','شبكة محلية صغيرة'],['OSI','7 طبقات معيارية'],['TCP','مضمون مع مصافحة ثلاثية'],['UDP','سريع غير مضمون'],['IP','عنوان منطقي للتوجيه'],['DNS','يترجم النطاقات لعناوين IP']]},

u5:{id:'u5',n:5,c:'c1',t:'الخوارزميات والتعقيد',ic:'fas fa-code-branch',dur:'90 د',dif:'متقدم',
obj:['تعريف الخوارزمية','البحث الخطي والثنائي','خوارزميات الفرز','تدوين Big-O','مقارنة التعقيدات'],
sec:[
{t:'ما هي الخوارزمية؟',c:'<p style="margin-bottom:8px">خطوات محددة مرتبة لحل مشكلة.</p><div style="display:flex;flex-direction:column;gap:3px">'+[['محددة','واضحة لا غموض'],['منتهية','تتوقف بعد خطوات محدودة'],['صحيحة','نتيجة صحيحة'],['فعّالة','أقل موارد'],['عامة','تحل فئة مشاكل']].map(([a,b])=>'<div style="display:flex;align-items:center;gap:6px;font-size:12px"><i class="fas fa-check-circle" style="color:var(--ac);font-size:10px"></i><strong>'+a+':</strong><span style="color:var(--mt)">'+b+'</span></div>').join('')+'</div>'},
{t:'البحث: خطي مقابل ثنائي',c:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><div class="sc"><strong style="color:var(--ac2)">خطي O(n)</strong><p>يفحص كل عنصر. أي بيانات.</p></div><div class="sc"><strong style="color:var(--ac)">ثنائي O(log n)</strong><p>يقارن بالمنتصف. يحتاج ترتيبًا.</p></div></div><div class="sc" style="font-size:11px;color:var(--mt)" dir="ltr">البحث عن 7 في [1,3,5,7,9,11]: مقارنة بـ5 ← أكبر ← [7,9,11] ← مقارنة بـ9 ← أصغر ← [7] ← وجدناه!</div>'},
{t:'خوارزميات الفرز',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc"><strong style="color:var(--er)">Bubble Sort — O(n²)</strong><p>يقارن أزواجًا متجاورة. بسيط لكن بطيء.</p></div><div class="sc"><strong style="color:#eab308">Selection Sort — O(n²)</strong><p>يختار الأصغر ويضعه أولاً. دائمًا n².</p></div><div class="sc"><strong style="color:var(--ac)">Merge Sort — O(n log n)</strong><p>يقسم ويُدمج مرتبًا. فعّال.</p></div></div>'},
{t:'تدوين Big-O',c:'<p style="margin-bottom:6px;font-size:13px">يصف <strong style="color:var(--ac)">معدل نمو الزمن</strong>:</p><div style="display:flex;flex-direction:column;gap:4px">'+[['O(1)','ثابت','var(--ac)'],['O(log n)','لوغاريتمي','#22c55e'],['O(n)','خطي','#eab308'],['O(n log n)','شبه خطي','#f97316'],['O(n²)','تربيعي','#ef4444'],['O(2^n)','أُسّي','#dc2626']].map(([a,b,c])=>'<div style="display:flex;align-items:center;gap:10px"><code style="background:var(--bg);padding:2px 8px;border-radius:4px;font-size:12px;font-family:monospace;width:56px;text-align:center;color:'+c+'">'+a+'</code><span style="font-size:12px">'+b+'</span></div>').join('')+'</div><p style="margin-top:6px;font-size:11px;color:var(--mt)">مليون عنصر: O(n)=مليون، O(n²)=تريليون!</p>'}
],svg:'bo',sum:['الخوارزمية = خطوات محددة مرتبة','البحث الثنائي أسرع بكثير من الخطي','Bubble O(n²) بطيء، Merge O(n log n) فعّال','Big-O يصف معدل النمو وليس الزمن المطلق','O(1)→O(log n)→O(n)→O(n²)→O(2^n)'],mis:['Big-O معدل نمو وليس زمنًا بالثواني','البحث الثنائي يتطلب بيانات مرتبة','Merge Sort أفضل رغم تعقيد كتابته'],qz:[{q:'تعقيد البحث الثنائي:',o:['O(n)','O(n²)','O(log n)','O(1)'],a:2},{q:'أي خوارزمية تحتاج ترتيب؟',o:['الخطي','الثنائي','الفقاعة','لا يوجد'],a:1},{q:'الأسرع للأبطأ:',o:['O(1)→O(n)→O(log n)','O(1)→O(log n)→O(n)→O(n²)','O(n²)→O(n)→O(1)','O(log n)→O(1)→O(n)'],a:1},{q:'تعقيد Merge Sort:',o:['O(n)','O(n²)','O(n log n)','O(2^n)'],a:2},{q:'خاصية "منتهية":',o:['سريعة','تتوقف','تعمل دائمًا','صحيحة'],a:1}],fl:[['الخوارزمية','خطوات مرتبة لحل مشكلة'],['البحث الثنائي','تقسيم النصف O(log n)'],['Big-O','معدل نمو الزمن أسوأ حالة'],['Bubble Sort','مقارنة أزواج O(n²)'],['Merge Sort','قسم ودمج O(n log n)'],['O(n²)','مليون عنصر = تريليون خطوة']]},

u6:{id:'u6',n:1,c:'c2',t:'مبادئ الأمن السيبراني',ic:'fas fa-lock',dur:'90 د',dif:'مبتدئ',
obj:['تعريف الأمن السيبراني','شرح ثلاثية CIA','التهديد/الثغرة/الهجوم/الخطر','تصنيف المهاجمين','إدارة المخاطر'],
sec:[
{t:'ما هو الأمن السيبراني؟',c:'<p style="margin-bottom:10px">حماية الأنظمة والشبكات والبيانات من الهجمات الرقمية.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="sc" style="border-color:rgba(0,212,170,.3)"><div style="font-weight:700;color:var(--ac)">الأمن المعلوماتي</div><p>أوسع — ورقي + رقمي.</p></div><div class="sc" style="border-color:rgba(255,107,157,.3)"><div style="font-weight:700;color:var(--ac2)">الأمن السيبراني</div><p>أضيق — رقمي فقط.</p></div></div>'},
{t:'نموذج CIA',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc" style="border-right:4px solid var(--ac)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fas fa-lock" style="color:var(--ac)"></i><strong style="color:var(--ac)">السرية</strong></div><p>منع الوصول غير المصرّح — تشفير، كلمات مرور.</p></div><div class="sc" style="border-right:4px solid var(--ac2)"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fas fa-shield-halved" style="color:var(--ac2)"></i><strong style="color:var(--ac2)">السلامة</strong></div><p>منع التعديل — Hash، تواقيع رقمية.</p></div><div class="sc" style="border-right:4px solid #eab308"><div style="display:flex;align-items:center;gap:6px;margin-bottom:4px"><i class="fas fa-clock" style="color:#eab308"></i><strong style="color:#eab308">التوافر</strong></div><p>ضمان الوصول — نسخ احتياطي، خوادم بديلة.</p></div></div>'},
{t:'مصطلحات أساسية',c:'<div style="display:flex;flex-direction:column;gap:6px">'+[['التهديد','حدث محتمل يسبب ضررًا','var(--ac)'],['الثغرة','نقطة ضعف قابلة للاستغلال','var(--ac2)'],['الهجوم','استغلال فعلي لثغرة','#eab308'],['الخطر','احتمال × تأثير','var(--er)']].map(([a,b,c])=>'<div class="sc"><strong style="color:'+c+';font-size:13px">'+a+':</strong><span style="font-size:11px;color:var(--mt);margin-right:6px">'+b+'</span></div>').join('')+'</div>'},
{t:'تصنيف المهاجمين',c:'<div style="display:flex;flex-direction:column;gap:6px">'+[['القبعة السوداء','يسعى للضرر أو الربح','var(--er)'],['القبعة البيضاء','يختبر بإذن لتحسين الأمان','var(--ac)'],['القبعة الرمادية','بين الاثنين','#eab308'],['APTs','هجمات مدعومة دوليًا','var(--ac2)']].map(([a,b,c])=>'<div class="sc" style="border-right:3px solid '+c+'"><strong style="font-size:12px;color:'+c+'">'+a+':</strong><span style="font-size:11px;color:var(--mt)"> '+b+'</span></div>').join('')+'</div>'},
{t:'إدارة المخاطر',c:'<p style="margin-bottom:6px;font-size:13px">أربع استراتيجيات:</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+[['تجنب','إلغاء النشاط'],['نقل','تأمين أو Outsourcing'],['تقليل','تدابير أمنية'],['قبول','عندما يكون التأثير ضئيلاً']].map(([a,b])=>'<div class="sc"><strong style="font-size:12px;color:var(--ac)">'+a+':</strong><span style="font-size:11px;color:var(--mt)"> '+b+'</span></div>').join('')+'</div>'}
],svg:'cia',sum:['الأمن السيبراني جزء من الأمن المعلوماتي','CIA = سرية + سلامة + توافر','التهديد ≠ الثغرة','الخطر = احتمال × تأثير','القبعة البيضاء بإذن، السوداء بدونه'],mis:['الأمن ≠ السرية فقط','الخلط بين التهديد والثغرة','القبعة الرمادية ليست قانونية دائمًا'],qz:[{q:'ركن CIA لمنع التعديل:',o:['السرية','السلامة','التوافر','الموثوقية'],a:1},{q:'برنامج غير محدّث =',o:['تهديد','هجوم','ثغرة','خطر'],a:2},{q:'الأمن السيبراني أوسع:',o:['صح','خطأ'],a:1},{q:'ضمان توفر الموقع = ركن:',o:['السرية','السلامة','التوافر','المصادقة'],a:2},{q:'الخطر = احتمال ×',o:['مهاجمين','تأثير','ميزانية','ثغرات'],a:1}],fl:[['الأمن السيبراني','حماية الأنظمة في الفضاء الرقمي'],['السرية','منع الاطلاع غير المصرّح'],['السلامة','منع التعديل غير المصرّح'],['التوافر','ضمان الوصول عند الحاجة'],['الثغرة','نقطة ضعف قابلة للاستغلال'],['الخطر','احتمال الحدوث × حجم التأثير']]},

u7:{id:'u7',n:2,c:'c2',t:'التشفير والخوارزميات',ic:'fas fa-key',dur:'90 د',dif:'متوسط',
obj:['مبادئ التشفير','المتماثل مقابل غير المتماثل','AES و RSA','Diffie-Hellman','Hash والتوقيع الرقمي','PKI و HTTPS'],
sec:[
{t:'مبادئ التشفير',c:'<p style="margin-bottom:8px">تحويل النص الواضح إلى مشفّر بمفتاح.</p><div class="sc"><strong style="color:var(--ac)">مبدأ كيرشهوف:</strong><span style="color:var(--mt)"> الأمان يعتمد على <strong>سرية المفتاح فقط</strong>، لا على سرية الخوارزمية.</span></div>'},
{t:'المتماثل (AES)',c:'<p style="margin-bottom:6px">مفتاح واحد. AES: 128/192/256 بِت.</p><div style="display:flex;flex-direction:column;gap:4px"><div style="background:rgba(0,212,170,.06);border-radius:6px;padding:8px;border:1px solid rgba(0,212,170,.2);font-size:12px"><span style="color:var(--ac)">+</span> سريع — مناسب لكميات كبيرة</div><div style="background:rgba(255,107,157,.06);border-radius:6px;padding:8px;border:1px solid rgba(255,107,157,.2);font-size:12px"><span style="color:var(--ac2)">−</span> تحدي: كيف تُشارك المفتاح بأمان؟</div></div>'},
{t:'غير المتماثل (RSA)',c:'<p style="margin-bottom:6px">زوج مفاتيح: عام + خاص. يعتمد على الأعداد الأولية.</p><div style="display:flex;flex-direction:column;gap:4px"><div style="background:rgba(0,212,170,.06);border-radius:6px;padding:8px;border:1px solid rgba(0,212,170,.2);font-size:12px"><span style="color:var(--ac)">+</span> يحل مشكلة تبادل المفاتيح</div><div style="background:rgba(255,107,157,.06);border-radius:6px;padding:8px;border:1px solid rgba(255,107,157,.2);font-size:12px"><span style="color:var(--ac2)">−</span> بطيء ~1000× من AES</div></div>'},
{t:'Diffie-Hellman و Hash',c:'<p style="margin-bottom:8px"><strong style="color:var(--ac)">DH:</strong> إنشاء مفتاح مشترك <strong>دون إرساله</strong> عبر الشبكة.</p><div style="display:flex;flex-direction:column;gap:6px"><div class="sc"><strong style="color:var(--ac)">Hash:</strong><span style="color:var(--mt)"> بصمة ثابتة لا تُعكَر. SHA-256. تغيير بِت واحد يُغيّرها كليًا.</span></div><div class="sc"><strong style="color:var(--ac2)">التوقيع الرقمي:</strong><span style="color:var(--mt)"> Hash + RSA = سلامة + مصادقة.</span></div></div>'},
{t:'PKI و HTTPS',c:'<p style="margin-bottom:6px">الشهادة تربط مفتاحًا عامًا بهوية — توقّعها جهة موثوقة (CA).</p><p><strong style="color:var(--ac)">HTTPS</strong> = TLS (DH + AES + شهادة CA) = سرية + سلامة + مصادقة.</p>'}
],svg:'enc',sum:['المتماثل (AES): مفتاح واحد — سريع','غير المتماثل (RSA): زوج مفاتيح — بطيء','DH يُنتج مفتاحًا مشتركًا دون إرساله','Hash = بصمة لا تُعكَر','التوقيع = Hash + RSA','HTTPS = TLS: DH + AES + شهادة'],mis:['غير المتماثل يُكمّل المتماثل وليس بديلًا','التشفير يُعكَر بالمفتاح، Hash لا يُعكَر','HTTPS يحمي من التنصت فقط'],qz:[{q:'مفتاح واحد:',o:['غير متماثل','متماثل','هاش','توقيع'],a:1},{q:'كيرشهوف: الأمان يعتمد على:',o:['سرية الخوارزمية','سرية المفتاح','التعقيد','طول النص'],a:1},{q:'خاصية Hash:',o:['يُعكَر','بِت واحد يُغيّر البصمة','طول متغير','يحتاج مفتاح'],a:1},{q:'يحل مشكلة تبادل AES:',o:['طول المفتاح','DH','Hash','النسخ'],a:1},{q:'RSA أبطأ من AES بـ:',o:['10×','100×','~1000×','نفس'],a:2}],fl:[['متماثل','مفتاح واحد (AES)'],['غير متماثل','زوج مفاتيح (RSA)'],['AES','معيار التشفير المتماثل'],['Diffie-Hellman','تبادل مفتاح دون إرساله'],['Hash','بصمة لا تُعكَر (SHA-256)'],['PKI','بنية مفاتيح عامة مع شهادات']]},

u8:{id:'u8',n:3,c:'c2',t:'أمن الشبكات',ic:'fas fa-tower-broadcast',dur:'90 د',dif:'متوسط',
obj:['مخاطر Wi-Fi المفتوحة','التنصت و MITM و DoS','Firewall و VPN','HTTPS و TLS','IDS و IPS'],
sec:[
{t:'مخاطر Wi-Fi',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc" style="border-right:4px solid #ef4444"><strong style="color:#ef4444">التنصت:</strong><span style="color:var(--mt)"> التقاط حزم غير مشفّرة بـ Wireshark</span></div><div class="sc" style="border-right:4px solid #f97316"><strong style="color:#f97316">MITM:</strong><span style="color:var(--mt)"> التدخل بين المرسل والمستقبل</span></div><div class="sc" style="border-right:4px solid #eab308"><strong style="color:#eab308">Evil Twin:</strong><span style="color:var(--mt)"> شبكة وهمية بنفس الاسم</span></div></div>'},
{t:'DoS / DDoS',c:'<p style="margin-bottom:6px"><strong style="color:var(--ac)">DoS:</strong> إغراق خادم. <strong style="color:var(--ac)">DDoS:</strong> من آلاف أجهزة (بوتنت).</p><div class="sc"><strong style="color:#eab308">التأثير:</strong> يستهدف ركن <strong style="color:#eab308">التوافر</strong> — يُعطّل الخدمة.</div>'},
{t:'Firewall و VPN',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc"><strong style="color:var(--ac)">Firewall:</strong><p>يُفلتر حركة البيانات وفق قواعد. شبكي، تطبيقي، NGFW.</p></div><div class="sc"><strong style="color:var(--ac2)">VPN:</strong><p>نفق مشفّر — يحمي حتى على شبكات غير موثوقة. لا يُخفي هويتك بالكامل.</p></div></div>'},
{t:'HTTPS و IDS/IPS',c:'<p style="margin-bottom:8px"><strong style="color:var(--ac)">HTTPS:</strong> سرية + سلامة + مصادقة الخادم.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="sc"><strong style="color:var(--ac)">IDS</strong><p>يراقب ويُنبّه فقط. مثل كاميرا.</p></div><div class="sc"><strong style="color:var(--ac2)">IPS</strong><p>يمنع الهجوم فوريًا. مثل حارس.</p></div></div>'}

sec:[
{t:'الأمن مقابل الخصوصية',c:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px"><div class="sc" style="border-color:rgba(0,212,170,.3)"><div style="font-weight:700;color:var(--ac)">الأمن</div><p>حماية تقنية من الوصول والتعديل.</p></div><div class="sc" style="border-color:rgba(255,107,157,.3)"><div style="font-weight:700;color:var(--ac2)">الخصوصية</div><p>حق التحكم بما يُجمع عنك وكيف يُستخدم.</p></div></div><div class="sc"><p style="color:var(--mt)"><strong style="color:#eab308">مثال:</strong> تطبيق آمن لكن يُشارك بياناتك = أمن بلا خصوصية.</p></div>'},
{t:'كلمات المرور و 2FA',c:'<div style="display:flex;flex-direction:column;gap:8px"><div class="sc" style="border-right:4px solid var(--ac)"><strong style="color:var(--ac)">كلمات قوية:</strong><div style="margin-top:4px;background:var(--bg);border-radius:6px;padding:6px;font-size:12px;font-family:monospace" dir="ltr"><div style="color:var(--er)">ضعيفة: password123</div><div style="color:var(--ac)">قوية: T#9mK!pL2$wR</div></div></div><div class="sc" style="border-right:4px solid var(--ac2)"><strong style="color:var(--ac2)">2FA:</strong><span style="color:var(--mt)"> ما <strong>تعرفه</strong> (كلمة) + ما <strong>تملكه</strong> (هاتف/TOTP).</span></div></div>'},

{t:'الوعي الرقمي والتشريعات',c:'<div style="display:flex;flex-direction:column;gap:6px"><div class="sc" style="border-color:rgba(255,107,157,.2)"><strong style="color:#eab308">الوعي الرقمي:</strong><span style="color:var(--mt)"> راجع صلاحيات التطبيقات، لا تُشارك حساسات، احذر المسحوقات الرقمية.</span></div><div class="sc"><strong style="color:var(--ac)">GDPR — أوروبا:</strong><span style="color:var(--mt)"> حق النسيان، غرامات 4% من الإيرادات.</span></div><div class="sc"><strong style="color:var(--ac2)">PDPL — السعودية:</strong><span style="color:var(--mt)"> حماية البيانات الشخصية، شفافية المؤسسات.</span></div></div>'}

function mkQz(uid,u){const st=qs[uid];if(st.s)return'<div style="background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:24px;text-align:center"><div style="font-size:36px;font-weight:900;color:var(--ac);margin-bottom:4px">'+st.sc+'/'+u.qz.length+'</div><div style="color:var(--mt);font-size:13px;margin-bottom:16px">نتيجتك</div><div class="pb" style="margin-bottom:16px"><div class="pf" style="width:'+Math.round(st.sc/u.qz.length*100)+'%"></div></div><button class="bp" style="font-size:13px;padding:10px 24px" onclick="qs[\''+uid+'\']={a:{},s:false,sc:0};go(\'u\',\''+uid+'\');swT(\'qz\',\''+uid+'\')"><i class="fas fa-redo" style="margin-left:4px"></i>إعادة</button></div>';return'<div style="display:flex;flex-direction:column;gap:14px">'+u.qz.map((q,i)=>{const sel=st.a[i],ans=sel!==undefined;return'<div id="qi-'+i+'" style="background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:18px"><div style="font-weight:700;font-size:13px;margin-bottom:10px">'+(i+1)+'. '+q.q+'</div><div style="display:flex;flex-direction:column;gap:6px">'+q.o.map((o,j)=>{let cls='qo';let ic='';if(ans){cls+=' dis';if(j===q.a){cls+=' ok';ic='<i class="fas fa-check" style="color:var(--ok);font-size:10px"></i>'}else if(j===sel){cls+=' no';ic='<i class="fas fa-times" style="color:var(--er);font-size:10px"></i>'}}return'<div class="'+cls+'" onclick="ansQ(\''+uid+'\','+i+','+j+','+q.a+')"><div style="width:22px;height:22px;border-radius:50%;border:1px solid '+(ans&&j===q.a?'var(--ok)':ans&&j===sel?'var(--er)':'var(--bd)')+';display:flex;align-items:center;justify-content:center;flex-shrink:0;'+(ans&&j===q.a?'background:rgba(34,197,94,.15)':ans&&j===sel?'background:rgba(239,68,68,.15)':'')+'">'+ic+'</div><span style="font-size:13px">'+o+'</span></div>'}).join('')+'</div></div>'}).join('')+'</div>'}

function ansQ(uid,qi,ai,ci){const st=qs[uid];if(st.a[qi]!==undefined||st.s)return;st.a[qi]=ai;if(ai===ci){st.sc++;sOk()}else sNo();if(Object.keys(st.a).length===U[uid].qz.length){st.s=true;done.add(uid);svD()}document.getElementById('p-qz').innerHTML=mkQz(uid,U[uid])}
